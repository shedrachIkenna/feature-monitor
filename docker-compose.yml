# Local run: docker compose up --build, then open http://localhost:7860/
services:
  app:
    build: .
    image: feature-monitor:latest
    ports:
      - "7860:7860"
    environment:
      # Passed through from your shell; without it the container refuses recorded prompts.
      - FEATURE_MONITOR_RECORD_TOKEN
    volumes:
      # The SQLite database lives here, so it survives rebuilds and restarts.
      - feature-monitor-data:/data

volumes:
  feature-monitor-data:
