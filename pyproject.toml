[project]
name = "feature-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "datasets>=5.1.0",
    "fastapi>=0.143.1",
    "pyyaml>=6.0.3",
    "sae-lens>=6.54.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformer-lens>=3.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# On Linux (the Docker image) install the CPU-only torch build: PyPI's Linux torch pulls in
# several GB of NVIDIA CUDA libraries that a CPU container never uses. macOS keeps PyPI's torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
markers = ["requires_model: loads GPT-2 and the SAE, downloading them on first run"]
