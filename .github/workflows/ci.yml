# Continuous integration: check every push and pull request. Nothing here deploys anything.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Every test runs once per model profile (monitor/profiles.yaml).
    strategy:
      matrix:
        profile: [gpt2_small, gemma2_2b]
    env:
      # Fail loudly if a test not marked requires_model tries to download from Hugging Face.
      HF_HUB_OFFLINE: "1"
      FEATURE_MONITOR_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests that load the model and SAE download them first; skip them here.
      - run: uv run pytest -m "not requires_model"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only, to catch a broken Dockerfile; layers are cached between runs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
